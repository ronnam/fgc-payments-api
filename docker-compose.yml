services:
  fgc-payments-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fgc-payments-api
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
    networks:
      - fgc_network

networks:
  fgc_network:
    external: true
    name: fgcusers_fgc_network
